<!DOCTYPE html>
<html lang="en" data-theme="light" data-theme-mode="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pictures from San Francisco, Boston, Berkeley, and the South Bay by Sashank Balusu.">
  <title>Pictures — Sashank Balusu</title>
  <script>
    (() => {
      let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        const saved = localStorage.getItem('site-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch { /* Use the system theme. */ }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="icon" href="pineappleicon.png" type="image/x-icon">
  <link rel="preload" href="assets/imageMeta.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="assets/site-header.css">
  <link rel="stylesheet" href="assets/gallery.css?v=close-alignment-1">
</head>
<body class="pictures-page">
  <main>
    <h1 class="sr-only">Pictures by Sashank Balusu</h1>
    <div id="photo-field" class="photo-field" aria-label="Photo collection"></div>
    <noscript><p class="gallery-message">Enable JavaScript to browse the photo collection.</p></noscript>
  </main>

  <nav class="gallery-navigation" aria-label="Primary">
    <a href="index.html" aria-label="Sashank Balusu home">SB</a>
  </nav>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer" aria-describedby="viewer-caption">
    <div class="viewer-bar">
      <p id="viewer-count" aria-live="polite" aria-atomic="true"></p>
      <button type="button" id="viewer-close" autofocus>
        Close
        <svg class="viewer-close-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M1 1l10 10M11 1L1 11" />
        </svg>
      </button>
    </div>
    <div class="viewer-stage" id="viewer-stage"></div>
    <div class="viewer-bar viewer-bottom">
      <p id="viewer-caption"></p>
      <div class="viewer-controls">
        <button type="button" id="viewer-prev" aria-label="Previous photo"><span aria-hidden="true">←</span></button>
        <button type="button" id="viewer-next" aria-label="Next photo"><span aria-hidden="true">→</span></button>
      </div>
    </div>
  </dialog>

  <script src="assets/theme.js"></script>
  <script src="assets/galleryConfig.js"></script>
  <script type="module" src="assets/gallery.js?v=gallery-refine-1"></script>
</body>
</html>
