<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sashank Balusu</title>
  <link href="https://fonts.googleapis.com/css2?family=Bellefair&display=swap" rel="stylesheet">
  <link rel="icon" href="pineappleicon.png" type="image/x-icon">

  <style>
    :root{
      --ink:#ffffff;
      --tint: rgba(0, 0, 0, 0.65);
      --page-bg:#000000;
      --link:pink;
      --hairline: rgba(255, 255, 255, 0.06);
      --tile-bg:#000000;
      --tile-shadow:0 6px 18px rgba(255, 255, 255, 0.08);
      --lightbox-bg:rgba(255, 255, 255, 0.75);
      --gap: clamp(14px, 2.2vw, 34px);
      --nav-h: 56px;
    }
    :root[data-theme="light"]{
      --ink:#4d403b;
      --tint:rgba(248, 244, 238, 0.78);
      --page-bg:#f8f4ee;
      --link:#d9819c;
      --hairline:rgba(107, 82, 74, 0.12);
      --tile-bg:#f2ece4;
      --tile-shadow:0 6px 18px rgba(107, 82, 74, 0.14);
      --lightbox-bg:rgba(248, 244, 238, 0.88);
    }

    *{ box-sizing:border-box; }

    html, body { height: 100%; }
    body{
      margin:0;
      letter-spacing: -0.05em;
      color:var(--link);
      background:var(--page-bg);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
      overflow-x: hidden;
    }

    .nav{
      position:fixed; inset:0 0 auto 0; height:var(--nav-h);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 24px;
      background:var(--tint);
      z-index:10;

      will-change: transform;
      transform: translateZ(0);
    }
    .brand{ font-size:22px; }
    .tabs{ display:flex; align-items:center; gap:18px; }
    .tabs a{ color:var(--ink); text-decoration:none; font-size:18px; position:relative; }
    .tabs a::after{
      content:""; position:absolute; left:0; right:0; bottom:-2px; height:1px;
      background: currentColor; transform:scaleX(0); transform-origin:left; transition:.25s;
    }
    .tabs a:hover::after, .tabs a[aria-current="page"]::after{ transform:scaleX(1); }
    .theme-toggle{
      width:28px;
      height:28px;
      display:grid;
      place-items:center;
      padding:0;
      border:1px solid var(--hairline);
      border-radius:50%;
      color:pink;
      background:transparent;
      cursor:pointer;
    }
    .theme-toggle svg{
      width:16px;
      height:16px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .theme-toggle:hover,
    .theme-toggle:focus-visible{
      border-color:currentColor;
      outline:none;
    }

    main{
      min-height: 100svh;
      padding-top: calc(var(--nav-h) + clamp(18px, 4vw, 52px));
    }
    .gallery{
      position: relative;
      padding: 0 clamp(16px, 4vw, 56px) clamp(64px, 9vw, 132px);
    }

    .columns{
      display:grid;
      gap: clamp(56px, 9vw, 132px);
      max-width: 1520px;
      margin: 0 auto;
    }
    .city-group{
      display:grid;
      gap: 0;
    }
    .city-grid{
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-auto-rows: clamp(48px, 5.4vw, 94px);
      grid-auto-flow: dense;
      gap: var(--gap);
      align-items: stretch;
    }

    .tile{
      position: relative;
      overflow: hidden;
      min-width: 0;
      margin: 0;
      grid-column: auto / span var(--tile-cols, 4);
      grid-row: span var(--tile-rows, 3);
      background:var(--tile-bg);
      box-shadow: var(--tile-shadow);
      transition: filter .35s ease;
    }
    .tile a,
    .tile picture{
      display:block;
      width:100%;
      height:100%;
    }
    .tile img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .35s ease;
    }
    .tile:hover{
      z-index: 2;
      filter: saturate(1.04) contrast(1.03);
    }
    .tile:hover img{ transform: scale(1.035); }

    .viewport-city{
      position:fixed;
      left:clamp(12px, 2.4vw, 36px);
      bottom:clamp(4px, 1.1vw, 18px);
      z-index:4;
      max-width:calc(100vw - 24px);
      pointer-events:none;
      color:pink;
      font-family: "Bellefair", Georgia, serif;
      font-size: clamp(82px, 18vw, 270px);
      font-weight:400;
      letter-spacing:-0.055em;
      line-height:.78;
      white-space:nowrap;
      opacity:.94;
      text-shadow:none;
      transition:opacity .18s ease, transform .18s ease;
    }
    .viewport-city.is-changing{
      opacity:.18;
      transform:translateY(8px);
    }

    .lightbox{
      position: fixed; inset:0;
      display:grid; place-items:center;
      background: var(--lightbox-bg);
      z-index: 50;
      padding: clamp(12px, 4vw, 40px);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .25s ease, visibility .25s ease;
    }
    .lightbox.open{
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .lightbox-content{
      position: relative;
      display: inline-block;

      transform: translateY(12px) scale(.98);
      transition: transform .25s ease;
    }
    .lightbox.open .lightbox-content{
      transform: translateY(0) scale(1);
    }

    .lightbox img{
      max-width:100%;
      max-height: 86vh;
      box-shadow: 0 10px 40px rgba(255, 255, 255, 0.35);
      background:#ffffff;
    }

    .lightbox .close{
      position:absolute;
      top:8px;
      right:8px;
      font-size:28px;
      color:#ffffff;
      cursor:pointer;
      line-height:1;
      background:#000000;
      border:none;
      width:36px;
      height:36px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .brand a{ color:var(--ink); text-decoration:none; position:relative; }

    @media (max-width: 860px){
      :root{ --nav-h: 52px; }
      .nav{ padding:0 16px; }
      .brand{ font-size:20px; }
      .tabs a{ font-size:17px; }
      .gallery{ padding-inline: clamp(14px, 5vw, 28px); }
      .city-grid{
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-auto-rows: clamp(54px, 12vw, 96px);
      }
      .tile:nth-child(n){
        grid-column: auto / span 3 !important;
        grid-row: span 3 !important;
      }
      .tile:nth-child(3n + 1){
        grid-column: auto / span 6 !important;
        grid-row: span 4 !important;
      }
      .tile:nth-child(5n){
        grid-row: span 4 !important;
      }
      .viewport-city{ font-size: clamp(64px, 17vw, 132px); }
    }
    @media (max-width: 520px){
      .columns{
        gap: 46px;
      }
      .city-grid{
        grid-template-columns: 1fr;
        grid-auto-rows: auto;
        gap: 16px;
      }
      .tile:nth-child(n){
        grid-column: auto !important;
        grid-row: auto !important;
        aspect-ratio: 4 / 3;
      }
      .tile:nth-child(3n),
      .tile:nth-child(5n){
        aspect-ratio: 16 / 10;
      }
      .tile[data-shape="wide"]{ aspect-ratio: 16 / 9; }
      .tile[data-shape="panorama"]{ aspect-ratio: 21 / 9; }
      .tile[data-shape="square"]{ aspect-ratio: 1 / 1; }
      .tile[data-shape="tall"]{ aspect-ratio: 4 / 5; }
      .tile[data-shape="portrait"]{ aspect-ratio: 3 / 4; }
      .viewport-city{ font-size: clamp(52px, 16vw, 80px); }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="brand"><a href="index.html">Sashank Balusu</a></div>
    <nav class="tabs">
      <a href="drone.html" aria-current="page">Pictures</a>
      <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false" title="Toggle light mode">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
          <path d="M8 14c-1.6-1.2-2.5-3-2.5-5a6.5 6.5 0 0 1 13 0c0 2-.9 3.8-2.5 5-.8.6-1.2 1.3-1.2 2H9.2c0-.7-.4-1.4-1.2-2Z"/>
        </svg>
      </button>
    </nav>
  </header>

  <main>
    <section class="gallery">
      <div id="columns" class="columns"></div>
    </section>
  </main>

  <div id="viewport-city" class="viewport-city" aria-live="polite">Boston</div>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="lightbox-content">
      <button class="close" aria-label="Close">&times;</button>
      <img id="lightbox-img" alt="">
    </div>
  </div>

  <script src="./assets/galleryConfig.js"></script>
  <script>
    const root = document.documentElement;
    const themeToggle = document.querySelector('.theme-toggle');

    function setTheme(theme) {
      const light = theme === 'light';
      root.dataset.theme = theme;
      localStorage.setItem('theme', theme);
      themeToggle.setAttribute('aria-pressed', String(light));
      themeToggle.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
    }

    function toggleTheme() {
      setTheme(root.dataset.theme === 'light' ? 'dark' : 'light');
    }

    setTheme(localStorage.getItem('theme') || 'light');
    themeToggle.addEventListener('click', toggleTheme);

    let imageMeta = {};

    (function(){
      fetch('./assets/imageMeta.json')
      .then(r => r.ok ? r.json() : {})
      .then(meta => { imageMeta = meta || {}; build(true); })
      .catch(() => build(true));
      const galleryConfig = window.GALLERY_CONFIG || {};
      const imageOrder = galleryConfig.imageOrder || [];
      const cityByImage = galleryConfig.cityByImage || {};
      localStorage.removeItem('galleryCropDraft');
      const savedCropConfig = JSON.parse(localStorage.getItem('galleryCropDraftV2') || '{}');
      const cropByImage = { ...(galleryConfig.cropByImage || {}), ...savedCropConfig };
      const shapeDefaults = {
        wide: { cols: 5, rows: 3 },
        panorama: { cols: 7, rows: 3 },
        square: { cols: 4, rows: 4 },
        tall: { cols: 4, rows: 6 },
        portrait: { cols: 3, rows: 6 }
      };

      const columnsRoot = document.getElementById('columns');
      const viewportCity = document.getElementById('viewport-city');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const closeBtn = lightbox.querySelector('.close');
      let activeCity = viewportCity.textContent;
      let ticking = false;

      function makeTile(src, i){
        const fig = document.createElement('figure');
        fig.className = 'tile';
        const crop = cropByImage[src] || {};
        fig.dataset.city = crop.city || cityByImage[src] || 'Boston';
        const shape = crop.shape || 'wide';
        const defaults = shapeDefaults[shape] || shapeDefaults.wide;
        fig.dataset.shape = shape;
        const tileCols = Math.min(Math.max(Number(crop.cols) || defaults.cols, 1), 12);
        const tileRows = Math.min(Math.max(Number(crop.rows) || defaults.rows, 1), 8);
        const tileCol = Math.min(Math.max(Number(crop.col) || 0, 0), 12);
        const tileRow = Math.min(Math.max(Number(crop.row) || 0, 0), 32);
        fig.style.gridColumn = tileCol ? `${tileCol} / span ${tileCols}` : `auto / span ${tileCols}`;
        fig.style.gridRow = tileRow ? `${tileRow} / span ${tileRows}` : `span ${tileRows}`;
        fig.style.setProperty('--crop-x', `${Number.isFinite(crop.x) ? crop.x : 50}%`);
        fig.style.setProperty('--crop-y', `${Number.isFinite(crop.y) ? crop.y : 50}%`);

        const meta = imageMeta[src] || { w: 1600, h: 1066, lqip: '' };
        const base = src;
        const thumbPath = './assets/thumbs';
        const lightboxSrc = `${thumbPath}/1600w/${base}.jpg`;

        const a = document.createElement('a');
        a.href = lightboxSrc;
        a.addEventListener('click', (e)=>{
          e.preventDefault();
          openLightbox(lightboxSrc);
        });

        const picture = document.createElement('picture');
        picture.innerHTML = `
          <source type="image/avif"
            srcset="${thumbPath}/1600w/${base}.avif 1600w, ${thumbPath}/960w/${base}.avif 960w, ${thumbPath}/480w/${base}.avif 480w">
          <source type="image/webp"
            srcset="${thumbPath}/1600w/${base}.webp 1600w, ${thumbPath}/960w/${base}.webp 960w, ${thumbPath}/480w/${base}.webp 480w">
          <img
            src="${thumbPath}/960w/${base}.jpg"
            srcset="${thumbPath}/1600w/${base}.jpg 1600w, ${thumbPath}/960w/${base}.jpg 960w, ${thumbPath}/480w/${base}.jpg 480w"
            sizes="(min-width:1200px) 42vw, (min-width:861px) 50vw, (min-width:521px) 50vw, 100vw"
            width="${meta.w}" height="${meta.h}"
            alt="${src.split('/').pop()}"
            loading="lazy" decoding="async"
            style="object-position: var(--crop-x, 50%) var(--crop-y, 50%); background: url('${meta.lqip || ''}') center/cover no-repeat;"
          >
        `;

        const img = picture.querySelector('img');
        if (i < 3) img.fetchPriority = 'high'; 

        a.appendChild(picture);
        fig.appendChild(a);
        return fig;
      }

      function getImageCity(src){
        const crop = cropByImage[src] || {};
        return crop.city || cityByImage[src] || 'Boston';
      }

      function groupImagesByCity(){
        const groups = [];
        const groupByCity = new Map();

        imageOrder.forEach(src => {
          const city = getImageCity(src);
          if (!groupByCity.has(city)) {
            const group = { city, images: [] };
            groupByCity.set(city, group);
            groups.push(group);
          }
          groupByCity.get(city).images.push(src);
        });

        return groups;
      }

      function makeCityGroup(group){
        const section = document.createElement('section');
        section.className = 'city-group';
        section.dataset.city = group.city;

        const grid = document.createElement('div');
        grid.className = 'city-grid';

        group.images.forEach((src, i) => grid.appendChild(makeTile(src, i)));
        section.append(grid);
        return section;
      }

      function build(force = false){
        if (!force) return;
        columnsRoot.innerHTML = '';
        groupImagesByCity().forEach(group => columnsRoot.appendChild(makeCityGroup(group)));
        updateViewportCity();
      }

      function setViewportCity(city){
        if (!city || city === activeCity) return;
        activeCity = city;
        viewportCity.classList.add('is-changing');
        window.setTimeout(() => {
          viewportCity.textContent = city;
          viewportCity.classList.remove('is-changing');
        }, 90);
      }

      function updateViewportCity(){
        const tiles = Array.from(columnsRoot.querySelectorAll('.tile'));
        if (!tiles.length) return;

        const targetY = window.innerHeight * 0.48;
        let closest = tiles[0];
        let closestDistance = Infinity;

        tiles.forEach(tile => {
          const rect = tile.getBoundingClientRect();
          const center = rect.top + rect.height / 2;
          const distance = Math.abs(center - targetY);
          if (distance < closestDistance) {
            closest = tile;
            closestDistance = distance;
          }
        });

        setViewportCity(closest.dataset.city);
      }

      function requestCityUpdate(){
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(() => {
          updateViewportCity();
          ticking = false;
        });
      }

      let scrollY = 0;
      function lockScroll(){
        scrollY = window.scrollY || document.documentElement.scrollTop || 0;
        document.documentElement.style.overflow = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.top = `-${scrollY}px`;
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
      }
      function unlockScroll(){
        document.documentElement.style.overflow = '';
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        window.scrollTo(0, scrollY);
      }

      function openLightbox(src){
        lightboxImg.src = src;
        lightboxImg.alt = src.split('/').pop();
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden','false');
        lockScroll();
      }

      function closeLightbox(){
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden','true');
        setTimeout(unlockScroll, 10);
      }

      closeBtn.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });
      document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeLightbox(); });
      window.addEventListener('scroll', requestCityUpdate, { passive: true });
      window.addEventListener('resize', requestCityUpdate);

    })();
  </script>
</body>
</html>
