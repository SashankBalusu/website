<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sashank Balusu</title>
  <link href="https://fonts.googleapis.com/css2?family=Bellefair&display=swap" rel="stylesheet">
  <link rel="icon" href="pineappleicon.png" type="image/x-icon">

  <style>
    :root{
      --ink:#ffffff;
      --tint: rgba(0, 0, 0, 0.65);
      --gap: 28px; 
      --nav-h: 56px;
      --cols: 3;
    }

    *{ box-sizing:border-box; }

    html, body { height: 100%; }
    body{
      margin:0;
      letter-spacing: -0.05em;
      color:var(--ink);
      background:#000000;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
      overflow-x: hidden;
    }

    .nav{
      position:fixed; inset:0 0 auto 0; height:var(--nav-h);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 24px;
      background:var(--tint);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      z-index:10;

      will-change: transform;
      transform: translateZ(0);
    }
    .brand{ font-size:22px; }
    .tabs{ display:flex; gap:18px; }
    .tabs a{ color:var(--ink); text-decoration:none; font-size:18px; position:relative; }
    .tabs a::after{
      content:""; position:absolute; left:0; right:0; bottom:-2px; height:1px;
      background: currentColor; transform:scaleX(0); transform-origin:left; transition:.25s;
    }
    .tabs a:hover::after, .tabs a[aria-current="page"]::after{ transform:scaleX(1); }

    main{ padding-top: calc(var(--nav-h) + 18px); }
    .gallery{ padding: 0 clamp(16px, 4vw, 48px) 72px; }

    .columns{
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      gap: var(--gap);
      align-items: start; 
    }
    .col{
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      min-width: 0;
    }

    .tile{
      position: relative;
      overflow: hidden; 
      background:#000000;
      box-shadow: 0 6px 18px rgba(255, 255, 255, 0.08);
    }
    .tile img{

      width: 100%;
      height: auto;
      display: block;
      transition: transform .35s ease;
    }
    .tile:hover img{ transform: scale(1.04); }

    .lightbox{
      position: fixed; inset:0;
      display:grid; place-items:center;
      background: rgba(255, 255, 255, 0.75);
      z-index: 50;
      padding: clamp(12px, 4vw, 40px);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .25s ease, visibility .25s ease;
    }
    .lightbox.open{
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .lightbox-content{
      position: relative;
      display: inline-block;

      transform: translateY(12px) scale(.98);
      transition: transform .25s ease;
    }
    .lightbox.open .lightbox-content{
      transform: translateY(0) scale(1);
    }

    .lightbox img{
      max-width:100%;
      max-height: 86vh;
      box-shadow: 0 10px 40px rgba(255, 255, 255, 0.35);
      background:#ffffff;
    }

    .lightbox .close{
      position:absolute;
      top:8px;
      right:8px;
      font-size:28px;
      color:#ffffff;
      cursor:pointer;
      line-height:1;
      background:#000000;
      border:none;
      width:36px;
      height:36px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .brand a{ color:var(--ink); text-decoration:none; position:relative; }

    @media (max-width: 860px){
      :root{ --nav-h: 52px; }
      .nav{ padding:0 16px; }
      .brand{ font-size:20px; }
      .tabs a{ font-size:17px; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="brand"><a href="index.html">Sashank Balusu</a></div>
    <nav class="tabs">
      <a href="drone.html" aria-current="page">Pictures</a>
    </nav>
  </header>

  <main>
    <section class="gallery">
      <div id="columns" class="columns"></div>
    </section>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="lightbox-content">
      <button class="close" aria-label="Close">&times;</button>
      <img id="lightbox-img" alt="">
    </div>
  </div>

  <script>
    let imageMeta = {};

    (function(){
      fetch('./assets/imageMeta.json')
      .then(r => r.ok ? r.json() : {})
      .then(meta => { imageMeta = meta || {}; build(true); })
      .catch(() => build(true));
      const imageOrder = [
        "drone19.JPG", "drone18.JPG", "drone20.JPG", "drone4.JPG","drone17.JPG","drone11.JPG","drone16.JPG","drone6.JPG",
        "drone3.JPG","drone9.JPG","drone14.JPG","drone1.JPG","drone15.JPG","drone13.JPG",
        "drone2.JPG","drone5.JPG","drone7.JPG","drone10.JPG","drone8.JPG"
      ];

      function computeCols(width){
        if(width >= 1600) return 3;
        if(width >= 1200) return 2;
        return 1; 
      }

      const columnsRoot = document.getElementById('columns');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const closeBtn = lightbox.querySelector('.close');

      let colEls = [];
      let resizeTimer;
      let currentCols = 0;
      let lastWidth = window.innerWidth;

      function setCols(n){
        columnsRoot.style.setProperty('--cols', n);
        columnsRoot.innerHTML = '';
        colEls = Array.from({length:n}, () => {
          const c = document.createElement('div');
          c.className = 'col';
          columnsRoot.appendChild(c);
          return c;
        });
      }

      function makeTile(src, i){
        const fig = document.createElement('figure');
        fig.className = 'tile';

        const a = document.createElement('a');
        a.href = src;
        a.addEventListener('click', (e)=>{
          e.preventDefault();
          openLightbox(src);
        });

        const meta = imageMeta[src] || { w: 1600, h: 1066, lqip: '' };
        const base = src;
        const thumbPath = './assets/thumbs';

        const picture = document.createElement('picture');
        picture.innerHTML = `
          <source type="image/avif"
            srcset="${thumbPath}/1600w/${base}.avif 1600w, ${thumbPath}/960w/${base}.avif 960w, ${thumbPath}/480w/${base}.avif 480w">
          <source type="image/webp"
            srcset="${thumbPath}/1600w/${base}.webp 1600w, ${thumbPath}/960w/${base}.webp 960w, ${thumbPath}/480w/${base}.webp 480w">
          <img
            src="${thumbPath}/960w/${base}.jpg"
            srcset="${thumbPath}/1600w/${base}.jpg 1600w, ${thumbPath}/960w/${base}.jpg 960w, ${thumbPath}/480w/${base}.jpg 480w"
            sizes="(min-width:1600px) 33vw, (min-width:1200px) 50vw, 100vw"
            width="${meta.w}" height="${meta.h}"
            alt="${src.split('/').pop()}"
            loading="lazy" decoding="async"
            style="background: url('${meta.lqip || ''}') center/cover no-repeat;"
          >
        `;

        const img = picture.querySelector('img');
        if (i < 3) img.fetchPriority = 'high'; 

        a.appendChild(picture);
        fig.appendChild(a);
        return fig;
      }


      function placeTileMasonry(tile){
        const heights = colEls.map(col => col.scrollHeight);
        const idx = heights.indexOf(Math.min(...heights));
        colEls[idx].appendChild(tile);
      }

      function build(force = false){
        const cols = computeCols(window.innerWidth);
        if (!force && cols === currentCols) return;
        currentCols = cols;

        setCols(cols);
        imageOrder.forEach((src, i) => placeTileMasonry(makeTile(src, i)));
      }

      function onResize(){
        const w = window.innerWidth;
        if (w === lastWidth) return; 
        lastWidth = w;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => build(false), 150);
      }

      let scrollY = 0;
      function lockScroll(){
        scrollY = window.scrollY || document.documentElement.scrollTop || 0;
        document.documentElement.style.overflow = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.top = `-${scrollY}px`;
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
      }
      function unlockScroll(){
        document.documentElement.style.overflow = '';
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        window.scrollTo(0, scrollY);
      }

      function openLightbox(src){
        lightboxImg.src = src;
        lightboxImg.alt = src.split('/').pop();
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden','false');
        lockScroll();
      }

      function closeLightbox(){
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden','true');
        setTimeout(unlockScroll, 10);
      }

      closeBtn.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });
      document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeLightbox(); });

      window.addEventListener('resize', onResize);
    })();
  </script>
</body>
</html>
